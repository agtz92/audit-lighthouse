name: site-monitor

# ─────────────────────────────────────────────────────────────────────────────
# Todo el sistema vive aquí: base de datos, worker (con su propio scheduler),
# analytics (Search Console y GA4, con el suyo) y dashboard. No hay cron de
# macOS ni contenedor de cron aparte.
#   docker compose up -d      levanta y programa la sincronización de las 05:00
#                             y la auditoría de las 06:00
# ─────────────────────────────────────────────────────────────────────────────

x-tz: &tz ${TZ:-America/Mexico_City}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sitemon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD; copia .env.example a .env}
      POSTGRES_DB: ${POSTGRES_DB:-sitemon}
      TZ: *tz
      PGTZ: *tz
    # Ajustado a los 384 MB que le asignamos abajo.
    command:
      - postgres
      - -c
      - shared_buffers=96MB
      - -c
      - max_connections=30
    volumes:
      - pgdata:/var/lib/postgresql/data
    # El puerto NO se publica: worker y dashboard llegan por la red de Compose.
    # Descomenta si quieres entrar con psql desde la Mac (5432 lo tiene el
    # Postgres nativo del host y 5433 fantasy-hq).
    # ports:
    #   - "${DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sitemon} -d ${POSTGRES_DB:-sitemon}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 384M

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sitemon}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sitemon}
      TZ: *tz
      SCHEDULE_CRON: ${SCHEDULE_CRON:-0 6 * * *}
      RECOVERY_RUN_ON_BOOT: ${RECOVERY_RUN_ON_BOOT:-true}
      CONCURRENCY: ${CONCURRENCY:-2}
      PAGE_CONCURRENCY: ${PAGE_CONCURRENCY:-3}
      LIGHTHOUSE_CONCURRENCY: ${LIGHTHOUSE_CONCURRENCY:-1}
      RUN_BUDGET_MINUTES: ${RUN_BUDGET_MINUTES:-90}
      SITE_BUDGET_MINUTES: ${SITE_BUDGET_MINUTES:-8}
      NAV_TIMEOUT_MS: ${NAV_TIMEOUT_MS:-30000}
      LIGHTHOUSE_TIMEOUT_MS: ${LIGHTHOUSE_TIMEOUT_MS:-120000}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      PERF_DROP_THRESHOLD: ${PERF_DROP_THRESHOLD:-10}
      CERT_EXPIRY_WARN_DAYS: ${CERT_EXPIRY_WARN_DAYS:-21}
      REPORT_AUTHOR_NAME: ${REPORT_AUTHOR_NAME:-José Alfredo Gutiérrez Guerra}
      REPORT_AUTHOR_ROLE: ${REPORT_AUTHOR_ROLE:-Consultor en soluciones de software e inteligencia artificial}
      REPORT_AUTHOR_CREDENTIALS: ${REPORT_AUTHOR_CREDENTIALS:-ITE 2016 · MNA 2027}
      # El integral toma su periodo de tráfico de aquí, igual que analitica.pdf.
      REPORT_PERIOD: ${REPORT_PERIOD:-month}
      TRAFFIC_DROP_THRESHOLD: ${TRAFFIC_DROP_THRESHOLD:-20}
      SITES_FILE: ${SITES_FILE:-/app/config/sites.yaml}
      CONTROL_PORT: ${CONTROL_PORT:-8099}
      PDF_DIR: ${PDF_DIR:-/data/pdfs}
      PDF_QUALITY: ${PDF_QUALITY:-ebook}
      PDF_COMPRESS_TIMEOUT_MS: ${PDF_COMPRESS_TIMEOUT_MS:-60000}
      PDF_RENDER_TIMEOUT_MS: ${PDF_RENDER_TIMEOUT_MS:-45000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      USER_AGENT: ${USER_AGENT:-site-monitor/1.0 (+auditoria interna)}
    volumes:
      - ./data/pdfs:/data/pdfs
      # Se monta el DIRECTORIO, no el archivo suelto. Ver la nota del dashboard:
      # montar sites.yaml directamente impide que el dashboard lo reescriba.
      - ./config:/app/config:ro
    # `expose`, NO `ports`: el endpoint de control queda disponible para el
    # dashboard dentro de la red de Compose y no se publica al host. Es lo que
    # mantiene el disparo manual de auditorías fuera del alcance de la LAN salvo
    # a través del dashboard.
    expose:
      - "${CONTROL_PORT:-8099}"
    # Permite que WEBHOOK_URL apunte a un servicio del host (host.docker.internal).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # DNS públicos en vez del router de la casa: el router guarda los "no existe"
    # por horas y, tras cambiar el DNS de un sitio, la auditoría fallaba con
    # ERR_NAME_NOT_RESOLVED aunque el dominio ya resolviera en todo internet.
    # Los nombres de Compose (`db`) los sigue resolviendo el DNS interno de Docker.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    # Chromium se ahoga con el /dev/shm de 64 MB que trae Docker por default.
    shm_size: 512mb
    # Reaper de PID 1: sin esto los Chromium que mueren mal quedan como zombies.
    init: true
    deploy:
      resources:
        limits:
          # El dashboard pedía 640 MB y usa ~20 MiB en reposo; ese margen rinde
          # mucho más aquí, donde Chromium, pdf-lib y Ghostscript compiten.
          memory: 2432M

  # ── Search Console y GA4 ──────────────────────────────────────────────────
  # Proceso aparte de la auditoría: misma imagen que el worker (comparte el
  # esquema, la configuración y el membrete de los informes), pero su propio
  # contenedor, su propio cron y su propio candado. Sincroniza a las 05:00 para
  # que el informe integral de las 06:00 encuentre el tráfico ya al día.
  analytics:
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: ["npm", "run", "analytics"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sitemon}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sitemon}
      TZ: *tz
      ANALYTICS_CRON: ${ANALYTICS_CRON:-0 5 * * *}
      ANALYTICS_CONTROL_PORT: ${ANALYTICS_CONTROL_PORT:-8098}
      RECOVERY_RUN_ON_BOOT: ${RECOVERY_RUN_ON_BOOT:-true}
      GOOGLE_CREDENTIALS_FILE: /app/secrets/google-sa.json
      ANALYTICS_REFRESH_DAYS: ${ANALYTICS_REFRESH_DAYS:-5}
      ANALYTICS_BACKFILL_DAYS: ${ANALYTICS_BACKFILL_DAYS:-486}
      ANALYTICS_RETENTION_DAYS: ${ANALYTICS_RETENTION_DAYS:-500}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      REPORT_PERIOD: ${REPORT_PERIOD:-month}
      TRAFFIC_DROP_THRESHOLD: ${TRAFFIC_DROP_THRESHOLD:-20}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      # Antes de imprimir PDFs pregunta si el worker está auditando: los dos
      # Chromium juntos no caben en la memoria de Docker.
      WORKER_URL: http://worker:${CONTROL_PORT:-8099}
      REPORT_AUTHOR_NAME: ${REPORT_AUTHOR_NAME:-José Alfredo Gutiérrez Guerra}
      REPORT_AUTHOR_ROLE: ${REPORT_AUTHOR_ROLE:-Consultor en soluciones de software e inteligencia artificial}
      REPORT_AUTHOR_CREDENTIALS: ${REPORT_AUTHOR_CREDENTIALS:-ITE 2016 · MNA 2027}
      SITES_FILE: ${SITES_FILE:-/app/config/sites.yaml}
      PDF_DIR: ${PDF_DIR:-/data/pdfs}
      PDF_QUALITY: ${PDF_QUALITY:-ebook}
      PDF_COMPRESS_TIMEOUT_MS: ${PDF_COMPRESS_TIMEOUT_MS:-60000}
      PDF_RENDER_TIMEOUT_MS: ${PDF_RENDER_TIMEOUT_MS:-45000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - ./data/pdfs:/data/pdfs
      - ./config:/app/config:ro
      # La llave de la cuenta de servicio. Solo este contenedor la ve: ni el
      # worker ni el dashboard —que está en la LAN sin autenticación— la tocan.
      - ./secrets:/app/secrets:ro
    # Igual que el worker: solo el dashboard alcanza este puerto.
    expose:
      - "${ANALYTICS_CONTROL_PORT:-8098}"
    shm_size: 256mb
    init: true
    deploy:
      resources:
        limits:
          # Sincronizar son llamadas HTTP; lo que pesa es el Chromium que
          # imprime analitica.pdf al final, uno a la vez.
          memory: 768M

  dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-sitemon}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sitemon}
      PDF_DIR: /data/pdfs
      SITES_FILE: /app/config/sites.yaml
      # Por aquí el dashboard le pide al worker auditorías a mano. El nombre
      # `worker` lo resuelve la red de Compose; desde fuera no existe.
      WORKER_URL: http://worker:${CONTROL_PORT:-8099}
      # Y por aquí le pide al servicio analytics sincronizar o probar una conexión.
      ANALYTICS_URL: http://analytics:${ANALYTICS_CONTROL_PORT:-8098}
      TZ: *tz
    volumes:
      # Solo lectura: el dashboard sirve los PDFs, nunca los escribe.
      - ./data/pdfs:/data/pdfs:ro
      # Con escritura: la pantalla de administración edita sites.yaml.
      #
      # Se monta el DIRECTORIO y no el archivo. Montar un archivo suelto parece
      # más preciso, pero hace imposible escribirlo bien: la escritura es
      # atómica (archivo temporal + rename) porque el worker lee este archivo al
      # empezar cada corrida y uno a medias rompería la auditoría de las 06:00, y
      # rename() sobre un bind mount de archivo devuelve EBUSY —el archivo ES el
      # punto de montaje, no se puede reemplazar—. Con el directorio montado, el
      # temporal y el destino viven en el mismo sistema de archivos real y el
      # rename funciona. Por eso config/ existe y solo contiene sites.yaml: es lo
      # único que este servicio, expuesto en la LAN y sin autenticación, puede
      # escribir.
      - ./config:/app/config
    ports:
      - "${DASHBOARD_PORT:-8480}:3000"
    deploy:
      resources:
        limits:
          memory: 320M

volumes:
  pgdata:
