# ─────────────────────────────────────────────────────────────────────────────
# Lista de sitios auditados. Se lee en cada corrida: para agregar o quitar un
# sitio edita este archivo, no hace falta reiniciar ningún contenedor.
#
#   id       slug estable. Se usa para el nombre de la carpeta de PDFs y como
#            llave en la base de datos. Si lo cambias pierdes el historial del
#            sitio, así que elígelo una vez y déjalo quieto.
#   url      URL principal. Es la única que recibe Lighthouse, así que es la que
#            encabeza los dos informes del sitio (escritorio y móvil).
#   sitemap  opcional. Si no lo pones se busca /sitemap.xml y luego la directiva
#            Sitemap: de robots.txt; si tampoco hay, se crawlean links internos
#            desde la home.
#   exclude  patrones de URL (subcadena) que se ignoran al descubrir páginas.
#   pages    opcional. Las páginas que se auditan, elegidas a mano. Si está, el
#            descubrimiento sigue corriendo (para mantener el catálogo de
#            opciones al día) pero deja de decidir: se audita esta lista, con la
#            URL principal siempre incluida y hasta maxPages en total. Quítala
#            para volver al automático. Se edita desde el dashboard, en
#            Configuración -> el sitio -> Páginas que se auditan.
# ─────────────────────────────────────────────────────────────────────────────

defaults:
  # 5 páginas por sitio: la corrida completa de 20 sitios tiene que caber en la
  # ventana de las 6am. Es una MUESTRA del sitio, no el sitio completo. Cuáles 5
  # las decide el descubrimiento, salvo que el sitio declare `pages`.
  maxPages: 5
  timeoutMs: 30000
  viewport: { width: 1440, height: 900 }
  waitUntil: networkidle

sites:
  # ── Hule y derivados ──────────────────────────────────────────────────────
  - id: corthw
    name: Cort HW
    url: https://www.corthw.com
    sitemap: https://www.corthw.com/sitemap.xml # 32 URLs
    enabled: true
    pages:
      - https://www.corthw.com/
      - https://www.corthw.com/productos
      - https://www.corthw.com/contacto
      - https://www.corthw.com/productos/cortina-hawaiana-lisa-transparente
      - https://www.corthw.com/productos/tope-para-anden-laminado-con-cara-de-acero

  - id: matmarkt
    name: MatMarkt
    url: https://www.matmarkt.com
    sitemap: https://www.matmarkt.com/sitemap.xml # 62 URLs
    enabled: true

  - id: grupohule
    name: Grupo Hule
    url: https://www.grupohule.com
    # Sitemap índice: las URLs de dentro viven en el apex (grupohule.com, sin www).
    # El descubridor las acepta porque normaliza www/apex como el mismo sitio.
    sitemap: https://www.grupohule.com/sitemap.xml # 78 URLs vía sitemap-0.xml
    enabled: true

  - id: placadehule
    name: Placa de Hule
    url: https://www.placadehule.com
