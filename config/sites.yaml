  - id: expertoshule
    name: Expertos Hule
    url: https://www.expertoshule.com
    sitemap: https://www.expertoshule.com/sitemap.xml # 192 URLs
    enabled: true

  - id: hule-mx
    name: Hule MX
    url: https://www.hule.com.mx
    sitemap: https://www.hule.com.mx/sitemap.xml # 195 URLs
    enabled: true

  - id: phasa
    name: PHASA
